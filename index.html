<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Aulão ENEM | Matemática</title>

  <style>
    :root {
      --bg: #101827;
      --panel: #192438;
      --text: #f1f5f9;
      --muted: #a7b4c8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 35px 20px;
      text-align: center;
      background: linear-gradient(135deg, #172554, #0f766e);
    }

    header h1 {
      margin: 0 0 12px;
      font-size: clamp(25px, 4vw, 38px);
    }

    header p {
      margin: 0;
      color: #dbeafe;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 25px 18px 40px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    #busca {
      flex: 1;
      min-width: 220px;
      padding: 13px 15px;
      border: 1px solid #34445d;
      border-radius: 9px;
      background: var(--panel);
      color: white;
      font-size: 16px;
    }

    button {
      padding: 13px 18px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: #082032;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.1);
    }

    #status {
      color: var(--muted);
      margin: 10px 0 20px;
      line-height: 1.5;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(
        auto-fill, minmax(min(100%, 260px), 1fr)
      );
      gap: 20px;
    }

    .card {
      min-width: 0;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid #2b3a50;
      border-radius: 12px;
      transition: transform .2s, border-color .2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .imagem {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 260px;
      padding: 10px;
      background: #fff;
      cursor: zoom-in;
    }

    .imagem img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .info {
      padding: 15px;
    }

    .info h2 {
      margin: 0 0 13px;
      font-size: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .acoes {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .acoes a {
      display: inline-block;
      padding: 9px 11px;
      border-radius: 7px;
      background: #263650;
      color: white;
      text-decoration: none;
      font-size: 13px;
    }

    .acoes a:hover {
      background: #354966;
    }

    .vazio {
      grid-column: 1 / -1;
      padding: 25px;
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    footer a {
      color: var(--accent);
    }

    /* Visualização ampliada */

    dialog {
      width: min(95vw, 1100px);
      max-width: none;
      max-height: 95vh;
      padding: 15px;
      border: 1px solid #475569;
      border-radius: 12px;
      background: #0b1220;
      color: white;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, .88);
    }

    .modal-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 12px;
    }

    #tituloModal {
      overflow-wrap: anywhere;
      font-size: 15px;
    }

    #imagemModal {
      display: block;
      max-width: 100%;
      max-height: 75vh;
      margin: auto;
      object-fit: contain;
    }

    @media (max-width: 480px) {
      .imagem {
        height: 230px;
      }

      .container {
        padding-inline: 12px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Matemática no ENEM</h1>
    <p>Aulão de revisão • Questões e conteúdos essenciais</p>
  </header>

  <main class="container">
    <div class="toolbar">
      <input
        type="search"
        id="busca"
        placeholder="Buscar questão ou assunto..."
        aria-label="Buscar imagens"
      >

      <button id="atualizar" type="button">
        Atualizar imagens
      </button>
    </div>

    <p id="status" role="status" aria-live="polite">
      Carregando imagens do GitHub...
    </p>

    <section
      id="galeria"
      class="galeria"
      aria-label="Galeria de questões"
    ></section>
  </main>

  <dialog id="modal">
    <div class="modal-topo">
      <span id="tituloModal"></span>
      <button id="fecharModal" type="button">Fechar ✕</button>
    </div>
    <img id="imagemModal" alt="">
  </dialog>

  <footer>
    <p>Material de revisão para o ENEM</p>
    <a
      href="https://github.com/fabatra/enem_aulao"
      target="_blank"
      rel="noopener noreferrer"
    >
      Acessar repositório no GitHub
    </a>
  </footer>

  <script>
    const API =
      "https://api.github.com/repos/fabatra/enem_aulao/contents";

    const galeria = document.getElementById("galeria");
    const status = document.getElementById("status");
    const busca = document.getElementById("busca");
    const modal = document.getElementById("modal");
    const imagemModal = document.getElementById("imagemModal");
    const tituloModal = document.getElementById("tituloModal");

    let imagens = [];

    function nomeLegivel(nome) {
      return nome
        .replace(/\.[^.]+$/, "")
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function criarCard(arquivo) {
      const card = document.createElement("article");
      card.className = "card";

      const areaImagem = document.createElement("div");
      areaImagem.className = "imagem";

      const img = document.createElement("img");
      img.src = arquivo.download_url;
      img.alt = nomeLegivel(arquivo.name);
      img.loading = "lazy";
      img.decoding = "async";

      img.addEventListener("error", () => {
        areaImagem.textContent = "Não foi possível carregar a imagem.";
      });

      areaImagem.appendChild(img);

      areaImagem.addEventListener("click", () => {
        imagemModal.src = arquivo.download_url;
        imagemModal.alt = nomeLegivel(arquivo.name);
        tituloModal.textContent = nomeLegivel(arquivo.name);
        modal.showModal();
      });

      const info = document.createElement("div");
      info.className = "info";

      const titulo = document.createElement("h2");
      titulo.textContent = nomeLegivel(arquivo.name);

      const acoes = document.createElement("div");
      acoes.className = "acoes";

      const abrir = document.createElement("a");
      abrir.href = arquivo.download_url;
      abrir.target = "_blank";
      abrir.rel = "noopener noreferrer";
      abrir.textContent = "Abrir imagem";

      const baixar = document.createElement("a");
      baixar.href = arquivo.download_url;
      baixar.target = "_blank";
      baixar.rel = "noopener noreferrer";
      baixar.textContent = "Baixar";
      baixar.setAttribute("download", arquivo.name);

      acoes.append(abrir, baixar);
      info.append(titulo, acoes);
      card.append(areaImagem, info);

      return card;
    }

    function renderizar() {
      const termo = busca.value
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();

      const filtradas = imagens.filter(arquivo => {
        const nome = nomeLegivel(arquivo.name)
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();

        return nome.includes(termo);
      });

      galeria.replaceChildren();

      if (filtradas.length === 0) {
        const vazio = document.createElement("div");
        vazio.className = "vazio";
        vazio.textContent = imagens.length
          ? "Nenhuma imagem corresponde à sua busca."
          : "Nenhuma imagem encontrada no repositório.";
        galeria.appendChild(vazio);
      } else {
        const fragmento = document.createDocumentFragment();

        filtradas.forEach(arquivo => {
          fragmento.appendChild(criarCard(arquivo));
        });

        galeria.appendChild(fragmento);
      }

      status.textContent =
        `${filtradas.length} imagem(ns) encontrada(s)` +
        (filtradas.length !== imagens.length
          ? ` de ${imagens.length} arquivo(s).`
          : " no repositório.");
    }

    async function carregarImagens() {
      status.textContent = "Buscando imagens no GitHub...";
      galeria.replaceChildren();

      try {
        const resposta = await fetch(API, {
          headers: { Accept: "application/vnd.github+json" },
          cache: "no-store"
        });

        if (!resposta.ok) {
          throw new Error(
            resposta.status === 403 || resposta.status === 429
              ? "Limite temporário de consultas do GitHub atingido."
              : `Erro HTTP ${resposta.status}.`
          );
        }

        const arquivos = await resposta.json();

        imagens = arquivos
          .filter(arquivo =>
            arquivo.type === "file" &&
            /\.(png|jpe?g|gif|webp|avif|bmp|svg)$/i
              .test(arquivo.name)
          )
          .sort((a, b) =>
            a.name.localeCompare(
              b.name, "pt-BR", { numeric: true }
            )
          );

        renderizar();
      } catch (erro) {
        console.error(erro);
        status.textContent =
          "Não foi possível carregar as imagens. " +
          erro.message +
          " Verifique sua conexão e tente novamente.";

        galeria.replaceChildren();

        const aviso = document.createElement("p");
        aviso.className = "vazio";
        aviso.textContent =
          "Confira se o repositório está público e tente atualizar.";
        galeria.appendChild(aviso);
      }
    }

    busca.addEventListener("input", renderizar);

    document.getElementById("atualizar")
      .addEventListener("click", carregarImagens);

    document.getElementById("fecharModal")
      .addEventListener("click", () => modal.close());

    modal.addEventListener("click", evento => {
      if (evento.target === modal) modal.close();
    });

    carregarImagens();
  </script>
</body>
</html>
